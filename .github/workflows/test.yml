name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Fmt
      run: test -z "$(gofmt -l .)"

    - name: Vet
      run: go vet ./...

    - name: Download Xray
      run: |
        curl -sSfLo "$RUNNER_TEMP/xray.zip" https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip
        unzip -o "$RUNNER_TEMP/xray.zip" xray -d "$RUNNER_TEMP/xray"
        echo "XRAY_BINARY=$RUNNER_TEMP/xray/xray" >> "$GITHUB_ENV"

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage
      uses: codecov/codecov-action@v6
      with:
        files: coverage.out
        token: ${{ secrets.CODECOV_TOKEN }}
